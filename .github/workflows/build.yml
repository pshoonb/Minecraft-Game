name: Build RPG Core Prototype

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rpgcore-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on Java 21 / runner Gradle
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # The GitHub-hosted Ubuntu image already includes Gradle.
      # Avoid downloading a separate distribution, which returned HTTP 504.
      - name: Verify preinstalled Gradle
        shell: bash
        run: |
          if ! command -v gradle >/dev/null 2>&1; then
            echo "::error::Gradle is not preinstalled on this runner."
            exit 1
          fi
          gradle --version
          GRADLE_VERSION="$(gradle --version | awk '/^Gradle / { print $2; exit }')"
          if [[ -z "$GRADLE_VERSION" || "${GRADLE_VERSION%%.*}" != "9" ]]; then
            echo "::error::Expected a Gradle 9.x installation; found '${GRADLE_VERSION:-unknown}'."
            exit 1
          fi

      - name: Build mod
        run: gradle --no-daemon clean build --stacktrace

      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rpgcore-prototype-${{ github.run_number }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpgcore-build-diagnostics-${{ github.run_number }}
          path: |
            build/reports/**
            build/test-results/**
            build/tmp/**
          if-no-files-found: ignore
          retention-days: 7
