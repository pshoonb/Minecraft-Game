name: Build RPG Core Prototype

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rpgcore-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on Java 21 / Gradle 9.2.1
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build mod
        run: gradle --no-daemon clean build --stacktrace

      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rpgcore-prototype-${{ github.run_number }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpgcore-build-diagnostics-${{ github.run_number }}
          path: |
            build/reports/**
            build/test-results/**
            build/tmp/**
          if-no-files-found: ignore
          retention-days: 7
