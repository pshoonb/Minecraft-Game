name: Build RPG Core Prototype

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Required for creating GitHub Releases from this repository.
permissions:
  contents: write

concurrency:
  group: rpgcore-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on Java 21 / runner Gradle
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # The GitHub-hosted Ubuntu image already includes Gradle.
      # Avoid downloading a separate distribution, which returned HTTP 504.
      - name: Verify preinstalled Gradle
        shell: bash
        run: |
          if ! command -v gradle >/dev/null 2>&1; then
            echo "::error::Gradle is not preinstalled on this runner."
            exit 1
          fi
          gradle --version
          GRADLE_VERSION="$(gradle --version | awk '/^Gradle / { print $2; exit }')"
          if [[ -z "$GRADLE_VERSION" || "${GRADLE_VERSION%%.*}" != "9" ]]; then
            echo "::error::Expected a Gradle 9.x installation; found '${GRADLE_VERSION:-unknown}'."
            exit 1
          fi

      - name: Build mod
        run: gradle --no-daemon clean build --stacktrace

      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rpgcore-prototype-${{ github.run_number }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      # Publish only successful builds from pushes to main.
      # Pull requests and manual workflow_dispatch runs do not publish.
      - name: Publish GitHub Release
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          MOD_VERSION="$(sed -n 's/^mod_version=//p' gradle.properties | head -n 1 | tr -d '\r')"
          if [[ -z "$MOD_VERSION" ]]; then
            echo "::error::Could not read mod_version from gradle.properties."
            exit 1
          fi

          mapfile -t JARS < <(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | sort)
          if [[ "${#JARS[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one distributable JAR in build/libs; found ${#JARS[@]}."
            printf '%s\n' "${JARS[@]}"
            exit 1
          fi

          JAR_PATH="${JARS[0]}"
          CHECKSUM_PATH="${JAR_PATH}.sha256"
          sha256sum "$JAR_PATH" > "$CHECKSUM_PATH"

          TAG="v${MOD_VERSION}-build.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "$JAR_PATH" "$CHECKSUM_PATH" \
            --title "$TAG" \
            --notes "自动构建发布。\n\nSource commit: ${GITHUB_SHA}\nBuild: ${GITHUB_RUN_NUMBER}" \
            --latest

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpgcore-build-diagnostics-${{ github.run_number }}
          path: |
            build/reports/**
            build/test-results/**
            build/tmp/**
          if-no-files-found: ignore
          retention-days: 7
